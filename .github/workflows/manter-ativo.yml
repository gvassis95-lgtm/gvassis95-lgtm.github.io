name: Manter Supabase ativo

# Faz uma consulta leve ao Supabase a cada 3 dias para o projeto gratuito
# não ser pausado por inatividade (7 dias sem uso).
on:
  schedule:
    - cron: '23 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao Supabase
        run: |
          HTML=$(curl -fsS https://gvassis95-lgtm.github.io/index.html)
          URL=$(echo "$HTML" | grep -oP "const SUPABASE_URL = '\K[^']+" | head -1)
          KEY=$(echo "$HTML" | grep -oP "const SUPABASE_PUBLISHABLE_KEY = '\K[^']+" | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Nao achei a configuracao no site"; exit 1; fi
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$URL/rest/v1/config_escola?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase respondeu: $CODE"
          if [ "$CODE" -ge 500 ] || [ "$CODE" -eq 000 ]; then exit 1; fi
